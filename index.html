<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Poster Index</title>
<style>
  :root {
    --bg: #0b0b0d;
    --surface: #17171a;
    --surface-hover: #202024;
    --border: #2a2a2e;
    --text: #eaeaec;
    --text-dim: #9a9aa2;
    --accent: #d4af37;
    --radius: 10px;
    --poster-ratio: 2 / 3; /* standard movie poster aspect ratio */
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 48px 32px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  h1 {
    font-size: 1.4rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    margin: 0 0 4px;
  }

  .subtitle {
    color: var(--text-dim);
    font-size: 0.9rem;
    margin: 0 0 32px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
    gap: 24px;
  }

  .card {
    display: block;
    text-decoration: none;
    color: inherit;
    border-radius: var(--radius);
    overflow: hidden;
    background: var(--surface);
    border: 1px solid var(--border);
    transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
  }

  .card:hover {
    transform: translateY(-4px);
    border-color: var(--accent);
    background: var(--surface-hover);
  }

  .card--no-link {
    cursor: default;
    opacity: 0.55;
  }

  .card--no-link:hover {
    transform: none;
    border-color: var(--border);
    background: var(--surface);
  }

  .poster {
    width: 100%;
    aspect-ratio: var(--poster-ratio);
    background: #000;
    overflow: hidden;
  }

  .poster img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .title {
    padding: 10px 12px 12px;
    font-size: 0.85rem;
    font-weight: 500;
    text-align: center;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .empty {
    color: var(--text-dim);
    font-size: 0.9rem;
  }
</style>
</head>
<body>
  <h1>Posters</h1>
  <p class="subtitle">1 title</p>

  <div class="grid">
    <a class="card" href="marjan/">
      <div class="poster">
        <img src="marjan.webp" alt="marjan poster" loading="lazy">
      </div>
      <div class="title">marjan</div>
    </a>
  </div>

    <div class="grid">
    <a class="card" href="tehran57/">
      <div class="poster">
        <img src="tehran57.webp" alt="Tehran 57 poster" loading="lazy">
      </div>
      <div class="title">Tehran 57 poster</div>
    </a>
  </div>
</body>
</html>
