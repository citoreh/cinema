<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scene Index — 438 frames</title>
<style>
  :root {
    --bg: #0b0c0f;
    --bg-panel: #131519;
    --border: #23262c;
    --text: #e8e6e1;
    --text-dim: #8b8e96;
    --accent: #d98f4e;
    --accent-dim: #7a5a38;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", "Vazirmatn", Roboto, Arial, sans-serif;
    min-height: 100vh;
  }
  header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: rgba(11,12,15,0.92);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
    padding: 20px 24px 16px;
  }
  h1 {
    margin: 0 0 2px;
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  .count {
    color: var(--text-dim);
    font-size: 12.5px;
    margin-bottom: 14px;
  }
  .search-wrap {
    position: relative;
    max-width: 560px;
  }
  #search {
    width: 100%;
    padding: 11px 14px 11px 38px;
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 14px;
    outline: none;
    transition: border-color 0.15s;
  }
  #search:focus { border-color: var(--accent-dim); }
  .search-icon {
    position: absolute;
    left: 13px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-dim);
    font-size: 14px;
    pointer-events: none;
  }
  main {
    padding: 22px 24px 60px;
    max-width: 1400px;
    margin: 0 auto;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 16px;
  }
  .card {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    cursor: pointer;
    transition: border-color 0.15s, transform 0.15s;
  }
  .card:hover {
    border-color: var(--accent-dim);
    transform: translateY(-2px);
  }
  .card img {
    width: 100%;
    aspect-ratio: 16/9;
    object-fit: cover;
    display: block;
    background: #000;
  }
  .card-body { padding: 12px 14px 14px; }
  .card-ts {
    color: var(--accent);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .card-snippet {
    font-size: 13px;
    line-height: 1.5;
    color: var(--text-dim);
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  mark {
    background: var(--accent-dim);
    color: var(--text);
    border-radius: 2px;
    padding: 0 1px;
  }
  .empty {
    text-align: center;
    color: var(--text-dim);
    padding: 80px 20px;
    font-size: 14px;
  }
  /* Modal */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    backdrop-filter: blur(4px);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    max-width: 900px;
    width: 100%;
    max-height: 88vh;
    overflow-y: auto;
    display: grid;
    grid-template-columns: 1fr;
  }
  @media (min-width: 720px) {
    .modal { grid-template-columns: 1.1fr 1fr; max-height: 78vh; }
  }
  .modal img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    background: #000;
  }
  .modal-text {
    padding: 22px 24px;
    white-space: pre-wrap;
    font-size: 13.5px;
    line-height: 1.65;
    color: var(--text);
  }
  .modal-close {
    position: absolute;
    top: 14px;
    right: 14px;
    background: rgba(0,0,0,0.5);
    border: 1px solid var(--border);
    color: var(--text);
    width: 32px;
    height: 32px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .modal-outer { position: relative; }
</style>
</head>

<header>

</header>

<main>

      <div class="modal-text" id="modalText"></div>
    </div>
  </div>
</div>

  const grid = document.getElementById('grid');
  const empty = document.getElementById('empty');
  const countEl = document.getElementById('count');
  const searchInput = document.getElementById('search');
  const overlay = document.getElementById('overlay');
  const modalImg = document.getElementById('modalImg');
  const modalText = document.getElementById('modalText');
  const modalClose = document.getElementById('modalClose');

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  function highlight(text, query) {
    if (!query) return escapeHtml(text);
    const escaped = escapeHtml(text);
    const q = escapeHtml(query).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    return escaped.replace(new RegExp('(' + q + ')', 'ig'), '<mark>$1</mark>');
  }

  function snippet(text, query) {
    if (!query) return text.slice(0, 160);
    const idx = text.toLowerCase().indexOf(query.toLowerCase());
    if (idx === -1) return text.slice(0, 160);
    const start = Math.max(0, idx - 40);
    return (start > 0 ? '…' : '') + text.slice(start, start + 160);
  }

  function render(query) {
    const q = query.trim().toLowerCase();
    const filtered = q
      ? DATA.filter(r => r.text.toLowerCase().includes(q))
      : DATA;

    countEl.textContent = q
      ? `${filtered.length} of ${DATA.length} frames match "${query}"`
      : `${DATA.length} frames`;

    grid.innerHTML = '';
    empty.style.display = filtered.length ? 'none' : 'block';

    filtered.forEach(r => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <img src="${escapeHtml(r.image)}" loading="lazy" alt="">
        <div class="card-body">
          <div class="card-ts">${escapeHtml(r.timestamp || ('Scene ' + r.id))}</div>
          <div class="card-snippet">${highlight(snippet(r.text, query), query)}</div>
        </div>
      `;
      card.addEventListener('click', () => openModal(r));
      grid.appendChild(card);
    });
  }

  function openModal(r) {
    modalImg.src = r.image;
    modalText.innerHTML = highlight(r.text, searchInput.value.trim());
    overlay.classList.add('open');
  }

  function closeModal() {
    overlay.classList.remove('open');
  }

  modalClose.addEventListener('click', closeModal);
  overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

  let debounceTimer;
  searchInput.addEventListener('input', () => {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(() => render(searchInput.value), 80);
  });

  render('');
</script>

</body>
</html>
